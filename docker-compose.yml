services:
  tinyfilemanagerplusplus:
    build: .
    container_name: tinyfilemanagerplusplus
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./data:/var/www/html/data          # your files
      - ./tfm-config:/config               # users and settings (settings.php), kept across rebuilds
    environment:
      TZ: UTC
      TFMPP_SETTINGS: /config/settings.php
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/') === false ? 1 : 0);"]
      interval: 30s
      timeout: 10s
      retries: 3
